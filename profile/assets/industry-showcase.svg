<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="386" viewBox="0 0 1200 386" role="img" aria-labelledby="title desc">
<title id="title">RISHEH — industry-led product thinking</title>
<desc id="desc">Three editorial case study themes: schools, specialized services, and AI-powered operations.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10283B"/><stop offset="1" stop-color="#113F36"/></linearGradient>
 <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#94BDA9"/><stop offset="1" stop-color="#E2E9D4"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#A8CFBA" stop-opacity=".2"/><stop offset="1" stop-color="#A8CFBA" stop-opacity="0"/></radialGradient>
</defs>
<style>
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes flow{to{stroke-dashoffset:-44}}
.dot{animation:glow 3.6s ease-in-out infinite}
.float{animation:drift 5.8s ease-in-out infinite}
.trace{stroke-dasharray:9 13;animation:flow 3s linear infinite}
@media (prefers-reduced-motion:reduce){.dot,.float,.trace{animation:none}}
</style>
<rect width="1200" height="386" rx="26" fill="url(#bg)"/>
<rect x="14" y="14" width="1172" height="358" rx="18" fill="none" stroke="#D9E7DE" stroke-opacity=".18"/>
